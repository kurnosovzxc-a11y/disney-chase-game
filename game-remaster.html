<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏰 Disney Hunter - Professional Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            overflow: hidden;
            color: white;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        .hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .stats-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid #00FF00;
            border-radius: 10px;
            font-size: 16px;
            min-width: 300px;
            font-family: 'Courier New', monospace;
            z-index: 10;
        }

        .stat-line {
            margin: 8px 0;
            color: #00FF00;
        }

        .stat-label {
            color: #00FFFF;
            font-weight: bold;
        }

        .enemy-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid #FF0000;
            border-radius: 10px;
            font-size: 14px;
            min-width: 280px;
            font-family: 'Courier New', monospace;
            z-index: 10;
        }

        .enemy-entry {
            margin: 8px 0;
            padding: 8px;
            background: rgba(255, 0, 0, 0.1);
            border-left: 3px solid #FF0000;
            border-radius: 3px;
        }

        .enemy-entry.caught {
            background: rgba(0, 255, 0, 0.1);
            border-left-color: #00FF00;
            color: #00FF00;
            text-decoration: line-through;
        }

        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 5;
        }

        .crosshair svg {
            width: 100%;
            height: 100%;
            stroke: #00FF00;
            stroke-width: 2;
            fill: none;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 30px;
            border: 2px solid #00FFFF;
            border-radius: 10px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 10;
        }

        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: #00FF00;
            padding: 30px;
            border: 3px solid #00FF00;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            display: none;
            pointer-events: none;
            z-index: 200;
            animation: popup 0.5s ease-out;
        }

        @keyframes popup {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000, #1a1a2e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .menu h1 {
            font-size: 48px;
            color: #00FF00;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #00FF00;
        }

        .menu button {
            padding: 15px 40px;
            margin: 10px;
            font-size: 18px;
            background: #00FF00;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .menu button:hover {
            background: #00FFFF;
            transform: scale(1.1);
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }

        .game-over h1 {
            font-size: 48px;
            color: #00FF00;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 20px;
            color: #00FFFF;
            margin: 10px;
        }

        .game-over button {
            padding: 15px 40px;
            margin-top: 30px;
            font-size: 18px;
            background: #00FF00;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .minimap {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00FFFF;
            border-radius: 5px;
            z-index: 10;
        }

        #minimap {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="menu" id="menu">
        <h1>🏰 DISNEY HUNTER</h1>
        <p style="color: #00FFFF; font-size: 18px; margin-bottom: 30px;">Professional Edition</p>
        <button onclick="startGame()">START GAME</button>
    </div>

    <div class="game-over" id="gameOverScreen">
        <h1>VICTORY!</h1>
        <p>Enemies Caught: <span id="finalCaught">0</span>/3</p>
        <p>Score: <span id="finalScore">0</span></p>
        <p>Time: <span id="finalTime">0:00</span></p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <div class="crosshair">
        <svg viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="10" fill="none" stroke="#00FF00" stroke-width="2"/>
            <line x1="25" y1="0" x2="25" y2="10" stroke="#00FF00" stroke-width="2"/>
            <line x1="25" y1="40" x2="25" y2="50" stroke="#00FF00" stroke-width="2"/>
            <line x1="0" y1="25" x2="10" y2="25" stroke="#00FF00" stroke-width="2"/>
            <line x1="40" y1="25" x2="50" y2="25" stroke="#00FF00" stroke-width="2"/>
            <circle cx="25" cy="25" r="3" fill="#00FF00"/>
        </svg>
    </div>

    <div class="hud">
        <div class="stats-panel">
            <div class="stat-line"><span class="stat-label">SCORE:</span> <span id="score">0</span></div>
            <div class="stat-line"><span class="stat-label">CAUGHT:</span> <span id="caught">0</span>/3</div>
            <div class="stat-line"><span class="stat-label">HEALTH:</span> <span id="health">███</span></div>
            <div class="stat-line"><span class="stat-label">TIME:</span> <span id="time">0:00</span></div>
            <div class="stat-line"><span class="stat-label">FPS:</span> <span id="fps">60</span></div>
        </div>

        <div class="enemy-panel">
            <div style="color: #FF0000; font-weight: bold; margin-bottom: 10px;">TARGETS:</div>
            <div id="enemyList"></div>
        </div>

        <div class="controls">
            WASD - Move | Mouse - Look Around | Space - Jump | Click - Catch
        </div>

        <div class="minimap">
            <canvas id="minimap" width="200" height="200"></canvas>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ===== VARIABLES =====
        let gameStarted = false;
        let gameOver = false;
        let score = 0;
        let caughtCount = 0;
        let gameTime = 0;
        let lastFrameTime = Date.now();
        let frameCount = 0;
        let fps = 60;

        // ===== THREE.JS SETUP =====
        let scene, camera, renderer;
        let player, enemies = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        function init() {
            const canvas = document.getElementById('canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 500, 2000);

            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                2000
            );
            camera.position.set(0, 15, 0);

            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas,
                antialias: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowShadowMap;

            // LIGHTING
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(200, 200, 200);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.far = 1000;
            sunLight.shadow.camera.left = -500;
            sunLight.shadow.camera.right = 500;
            sunLight.shadow.camera.top = 500;
            sunLight.shadow.camera.bottom = -500;
            scene.add(sunLight);

            createWorld();
            createPlayer();
            createEnemies();

            document.getElementById('menu').style.display = 'none';
            gameStarted = true;
            gameLoop();
        }

        // ===== WORLD CREATION =====
        function createWorld() {
            // GROUND
            const groundGeometry = new THREE.PlaneGeometry(1000, 1000);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x90EE90,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // CASTLE - MAIN TOWER
            const tower = new THREE.Mesh(
                new THREE.CylinderGeometry(50, 50, 150, 32),
                new THREE.MeshStandardMaterial({ color: 0xA0826D })
            );
            tower.position.set(0, 75, 0);
            tower.castShadow = true;
            tower.receiveShadow = true;
            scene.add(tower);

            // CASTLE - ROOF
            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(60, 80, 32),
                new THREE.MeshStandardMaterial({ color: 0xFF1493 })
            );
            roof.position.y = 155;
            roof.castShadow = true;
            scene.add(roof);

            // CASTLE - WALLS
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xB8860B });
            for (let i = 0; i < 4; i++) {
                const angle = (i / 4) * Math.PI * 2;
                const wallTower = new THREE.Mesh(
                    new THREE.CylinderGeometry(25, 25, 120, 24),
                    wallMaterial
                );
                wallTower.position.set(
                    Math.cos(angle) * 80,
                    60,
                    Math.sin(angle) * 80
                );
                wallTower.castShadow = true;
                wallTower.receiveShadow = true;
                scene.add(wallTower);
            }

            // TREES - CREATE FOREST
            for (let x = -400; x <= 400; x += 100) {
                for (let z = -400; z <= 400; z += 100) {
                    if (Math.abs(x) > 150 || Math.abs(z) > 150) {
                        const trunk = new THREE.Mesh(
                            new THREE.CylinderGeometry(15, 20, 60, 12),
                            new THREE.MeshStandardMaterial({ color: 0x654321 })
                        );
                        trunk.position.set(x + (Math.random() - 0.5) * 50, 30, z + (Math.random() - 0.5) * 50);
                        trunk.castShadow = true;
                        scene.add(trunk);

                        const foliage = new THREE.Mesh(
                            new THREE.SphereGeometry(40, 12, 12),
                            new THREE.MeshStandardMaterial({ color: 0x228B22 })
                        );
                        foliage.position.set(trunk.position.x, trunk.position.y + 60, trunk.position.z);
                        foliage.castShadow = true;
                        scene.add(foliage);
                    }
                }
            }
        }

        // ===== PLAYER CREATION =====
        function createPlayer() {
            const playerGroup = new THREE.Group();

            // BODY - SPHERE
            const body = new THREE.Mesh(
                new THREE.SphereGeometry(8, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xFF0000, roughness: 0.6 })
            );
            body.position.y = 8;
            body.castShadow = true;
            body.receiveShadow = true;
            playerGroup.add(body);

            // HEAD - SPHERE
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(7, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xFF2020, roughness: 0.6 })
            );
            head.position.y = 18;
            head.castShadow = true;
            head.receiveShadow = true;
            playerGroup.add(head);

            // EARS
            for (let i of [-1, 1]) {
                const ear = new THREE.Mesh(
                    new THREE.SphereGeometry(4, 8, 8),
                    new THREE.MeshStandardMaterial({ color: 0xFF0000 })
                );
                ear.position.set(i * 7, 23, 0);
                ear.scale.set(0.7, 0.9, 0.6);
                ear.castShadow = true;
                playerGroup.add(ear);
            }

            // EYES
            for (let i of [-1, 1]) {
                const eye = new THREE.Mesh(
                    new THREE.SphereGeometry(2, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0xFFFFFF })
                );
                eye.position.set(i * 3, 20, 6.5);
                playerGroup.add(eye);

                const pupil = new THREE.Mesh(
                    new THREE.SphereGeometry(1, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0x000000 })
                );
                pupil.position.set(i * 3, 20, 7);
                playerGroup.add(pupil);
            }

            // LEGS
            for (let i of [-1, 1]) {
                const leg = new THREE.Mesh(
                    new THREE.CylinderGeometry(3, 3, 10, 8),
                    new THREE.MeshStandardMaterial({ color: 0x333333 })
                );
                leg.position.set(i * 4, 3, 0);
                leg.castShadow = true;
                leg.receiveShadow = true;
                playerGroup.add(leg);
            }

            playerGroup.position.set(0, 0, 0);
            scene.add(playerGroup);

            player = {
                group: playerGroup,
                velocity: new THREE.Vector3(0, 0, 0),
                speed: 0.25,
                jumpPower: 0.5,
                isJumping: false,
                health: 3,
                maxHealth: 3,
                direction: new THREE.Vector3(0, 0, -1),
                eulerOrder: 'YXZ',
                pitch: 0,
                yaw: 0
            };
        }

        // ===== ENEMIES CREATION =====
        function createEnemies() {
            const configs = [
                { name: 'Gumba', color: 0x8B4513, pos: new THREE.Vector3(150, 0, 150) },
                { name: 'Captain Hook', color: 0x800000, pos: new THREE.Vector3(-150, 0, 150) },
                { name: 'Maleficent', color: 0x4B0082, pos: new THREE.Vector3(150, 0, -150) }
            ];

            configs.forEach(config => {
                const group = new THREE.Group();

                // BODY
                const body = new THREE.Mesh(
                    new THREE.SphereGeometry(7, 14, 14),
                    new THREE.MeshStandardMaterial({ color: config.color, roughness: 0.6 })
                );
                body.position.y = 7;
                body.castShadow = true;
                body.receiveShadow = true;
                group.add(body);

                // HEAD
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(6, 14, 14),
                    new THREE.MeshStandardMaterial({ color: config.color })
                );
                head.position.y = 16;
                head.castShadow = true;
                head.receiveShadow = true;
                group.add(head);

                // EYES
                for (let i of [-1, 1]) {
                    const eye = new THREE.Mesh(
                        new THREE.SphereGeometry(1.5, 8, 8),
                        new THREE.MeshBasicMaterial({ color: 0xFFFFFF })
                    );
                    eye.position.set(i * 2.5, 18, 5.5);
                    group.add(eye);

                    const pupil = new THREE.Mesh(
                        new THREE.SphereGeometry(0.8, 8, 8),
                        new THREE.MeshBasicMaterial({ color: 0xFF0000 })
                    );
                    pupil.position.set(i * 2.5, 18, 6);
                    group.add(pupil);
                }

                // LEGS
                for (let i of [-1, 1]) {
                    const leg = new THREE.Mesh(
                        new THREE.CylinderGeometry(2.5, 2.5, 8, 8),
                        new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
                    );
                    leg.position.set(i * 3.5, 2, 0);
                    leg.castShadow = true;
                    leg.receiveShadow = true;
                    group.add(leg);
                }

                group.position.copy(config.pos);
                scene.add(group);

                enemies.push({
                    name: config.name,
                    group: group,
                    position: config.pos.clone(),
                    velocity: new THREE.Vector3(0, 0, 0),
                    speed: 0.12,
                    health: 1,
                    caught: false,
                    visionRange: 150,
                    wanderTimer: 0,
                    targetRotation: Math.random() * Math.PI * 2,
                    lastSeenPlayerPos: null,
                    lastSeenTime: 0
                });
            });
        }

        // ===== INPUT HANDLING =====
        const keys = {};
        let mouseDown = false;
        let mouseMoveX = 0;
        let mouseMoveY = 0;

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('mousemove', (e) => {
            const deltaX = e.movementX || 0;
            const deltaY = e.movementY || 0;
            
            player.yaw -= deltaX * 0.003;
            player.pitch -= deltaY * 0.003;
            
            // CLAMP PITCH
            player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch));

            // UPDATE CAMERA
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
        });

        window.addEventListener('click', () => {
            mouseDown = true;
            setTimeout(() => { mouseDown = false; }, 100);
        });

        // ===== GAME LOOP =====
        function gameLoop() {
            requestAnimationFrame(gameLoop);

            if (!gameStarted) return;

            // UPDATE GAME TIME
            gameTime += 1 / 60;

            // ===== PLAYER MOVEMENT =====
            const forward = new THREE.Vector3(0, 0, -1);
            const right = new THREE.Vector3(1, 0, 0);

            forward.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
            right.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);

            const moveDir = new THREE.Vector3(0, 0, 0);
            if (keys['w'] || keys['arrowup']) moveDir.add(forward);
            if (keys['s'] || keys['arrowdown']) moveDir.sub(forward);
            if (keys['a'] || keys['arrowleft']) moveDir.sub(right);
            if (keys['d'] || keys['arrowright']) moveDir.add(right);

            if (moveDir.length() > 0) {
                moveDir.normalize();
                player.group.position.add(moveDir.multiplyScalar(player.speed));
            }

            // JUMP
            if ((keys[' '] || keys['spacebar']) && !player.isJumping) {
                player.velocity.y = player.jumpPower;
                player.isJumping = true;
            }

            // GRAVITY
            player.velocity.y -= 0.02;
            player.group.position.y += player.velocity.y;

            if (player.group.position.y <= 0) {
                player.group.position.y = 0;
                player.velocity.y = 0;
                player.isJumping = false;
            }

            // WORLD BOUNDARIES
            const mapSize = 450;
            player.group.position.x = Math.max(-mapSize, Math.min(mapSize, player.group.position.x));
            player.group.position.z = Math.max(-mapSize, Math.min(mapSize, player.group.position.z));

            // ===== ENEMY AI =====
            enemies.forEach(enemy => {
                if (enemy.caught) return;

                const distToPlayer = enemy.group.position.distanceTo(player.group.position);

                // SEE PLAYER
                if (distToPlayer < enemy.visionRange) {
                    enemy.lastSeenPlayerPos = player.group.position.clone();
                    enemy.lastSeenTime = Date.now();

                    const dirToPlayer = new THREE.Vector3()
                        .subVectors(player.group.position, enemy.group.position)
                        .normalize();

                    enemy.group.position.add(dirToPlayer.multiplyScalar(enemy.speed));
                    enemy.group.rotation.y = Math.atan2(dirToPlayer.x, dirToPlayer.z);

                    // CHECK IF CAUGHT
                    if (distToPlayer < 15 && mouseDown) {
                        catchEnemy(enemy);
                    }
                } else {
                    // WANDER BEHAVIOR
                    enemy.wanderTimer--;
                    if (enemy.wanderTimer <= 0) {
                        enemy.targetRotation = Math.random() * Math.PI * 2;
                        enemy.wanderTimer = 120;
                    }

                    const wanderDir = new THREE.Vector3(
                        Math.sin(enemy.targetRotation),
                        0,
                        Math.cos(enemy.targetRotation)
                    );

                    enemy.group.position.add(wanderDir.multiplyScalar(enemy.speed * 0.5));
                    enemy.group.rotation.y = enemy.targetRotation;
                }

                // BOUNDARIES
                enemy.group.position.x = Math.max(-mapSize, Math.min(mapSize, enemy.group.position.x));
                enemy.group.position.z = Math.max(-mapSize, Math.min(mapSize, enemy.group.position.z));
            });

            // ===== CAMERA FOLLOW =====
            const cameraOffset = new THREE.Vector3(0, 12, 25);
            cameraOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
            
            camera.position.x = player.group.position.x + cameraOffset.x;
            camera.position.y = player.group.position.y + cameraOffset.y;
            camera.position.z = player.group.position.z + cameraOffset.z;

            // ===== UPDATE UI =====
            updateUI();
            updateMinimap();

            // ===== FPS COUNTER =====
            frameCount++;
            const now = Date.now();
            if (now - lastFrameTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFrameTime = now;
            }

            renderer.render(scene, camera);
        }

        function catchEnemy(enemy) {
            enemy.caught = true;
            scene.remove(enemy.group);
            caughtCount++;
            score += 1000;

            showNotification(`✓ ${enemy.name} CAUGHT!`);

            updateEnemyList();

            if (caughtCount === 3) {
                endGame();
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('caught').textContent = caughtCount;
            document.getElementById('health').textContent = '█'.repeat(player.health) + '░'.repeat(player.maxHealth - player.health);
            
            const minutes = Math.floor(gameTime / 60);
            const seconds = Math.floor(gameTime % 60);
            document.getElementById('time').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('fps').textContent = fps;

            updateEnemyList();
        }

        function updateEnemyList() {
            const list = document.getElementById('enemyList');
            list.innerHTML = '';
            
            enemies.forEach(enemy => {
                const div = document.createElement('div');
                div.className = 'enemy-entry' + (enemy.caught ? ' caught' : '');
                
                const dist = enemy.group.position.distanceTo(player.group.position);
                const status = enemy.caught ? '✓' : (dist < enemy.visionRange ? '!' : '?');
                
                div.textContent = `[${status}] ${enemy.name} (${Math.floor(dist)}m)`;
                list.appendChild(div);
            });
        }

        function updateMinimap() {
            const canvas = document.getElementById('minimap');
            const ctx = canvas.getContext('2d');
            const scale = 200 / 1000;

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 200, 200);

            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, 200, 200);

            // GRID
            ctx.strokeStyle = '#003300';
            for (let i = 0; i <= 4; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 50, 0);
                ctx.lineTo(i * 50, 200);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * 50);
                ctx.lineTo(200, i * 50);
                ctx.stroke();
            }

            // ENEMIES
            enemies.forEach(enemy => {
                if (!enemy.caught) {
                    ctx.fillStyle = '#FF0000';
                    ctx.beginPath();
                    ctx.arc(
                        100 + enemy.group.position.x * scale,
                        100 + enemy.group.position.z * scale,
                        4,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            });

            // PLAYER
            ctx.fillStyle = '#00FF00';
            ctx.beginPath();
            ctx.arc(100 + player.group.position.x * scale, 100 + player.group.position.z * scale, 5, 0, Math.PI * 2);
            ctx.fill();

            // DIRECTION INDICATOR
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 2;
            const dirX = Math.sin(player.yaw) * 20;
            const dirZ = Math.cos(player.yaw) * 20;
            ctx.beginPath();
            ctx.moveTo(100 + player.group.position.x * scale, 100 + player.group.position.z * scale);
            ctx.lineTo(100 + player.group.position.x * scale + dirX, 100 + player.group.position.z * scale + dirZ);
            ctx.stroke();
        }

        function showNotification(text) {
            const notification = document.getElementById('notification');
            notification.textContent = text;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 1500);
        }

        function endGame() {
            gameStarted = false;
            document.getElementById('gameOverScreen').style.display = 'flex';
            document.getElementById('finalCaught').textContent = caughtCount;
            document.getElementById('finalScore').textContent = score;
            
            const minutes = Math.floor(gameTime / 60);
            const seconds = Math.floor(gameTime % 60);
            document.getElementById('finalTime').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function startGame() {
            init();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // REQUEST POINTER LOCK
        document.addEventListener('click', () => {
            document.documentElement.requestPointerLock = 
                document.documentElement.requestPointerLock || 
                document.documentElement.mozRequestPointerLock;
            document.documentElement.requestPointerLock();
        });
    </script>
</body>
</html>

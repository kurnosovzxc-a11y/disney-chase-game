<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏰 Охота за Диснеевскими Героями</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            z-index: 10;
            border: 2px solid #FFD700;
        }

        .ui h2 {
            margin-bottom: 15px;
            font-size: 28px;
            color: #FFD700;
        }

        .ui p {
            margin: 8px 0;
            font-size: 16px;
        }

        .enemy-tracker {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 15px;
            z-index: 10;
            border: 2px solid #FF6B9D;
            min-width: 200px;
        }

        .enemy-tracker h3 {
            color: #FF6B9D;
            margin-bottom: 10px;
        }

        .enemy-item {
            padding: 8px;
            margin: 5px 0;
            background: rgba(255,107,157,0.2);
            border-radius: 5px;
            font-size: 14px;
        }

        .enemy-item.caught {
            background: rgba(50,205,50,0.3);
            text-decoration: line-through;
            color: #90EE90;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            border: 2px solid #00BFFF;
            font-size: 14px;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(50,50,150,0.9));
            color: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            display: none;
            border: 3px solid #FFD700;
        }

        .game-over h1 {
            font-size: 56px;
            margin-bottom: 20px;
            color: #FFD700;
        }

        .game-over p {
            font-size: 24px;
            margin: 15px 0;
        }

        .game-over button {
            background: linear-gradient(135deg, #FF6B9D, #FF1493);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            margin-top: 20px;
            transition: all 0.3s;
            font-weight: bold;
        }

        .game-over button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #FF6B9D;
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 5;
        }

        .crosshair::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 10px;
            background: #00FF00;
            left: 14px;
            top: 0;
        }

        .crosshair::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 2px;
            background: #00FF00;
            left: 0;
            top: 14px;
        }

        .catch-notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 10px #FFD700;
            pointer-events: none;
            animation: popUp 0.8s ease-out forwards;
            z-index: 50;
        }

        @keyframes popUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -150%) scale(1.5);
            }
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="loading" id="loadingScreen">
        ⏳ Загрузка парка Диснея... 🏰
    </div>

    <div class="crosshair"></div>

    <div class="ui">
        <h2>🎯 ОХОТА</h2>
        <p>⭐ Очки: <span id="score">0</span></p>
        <p>🎯 Поймано: <span id="caught">0</span>/3</p>
        <p>❤️ Здоровье: <span id="health">❤️❤️❤️</span></p>
        <p id="gameStatus" style="color: #FFD700; margin-top: 10px;"></p>
    </div>

    <div class="enemy-tracker">
        <h3>🎯 Враги</h3>
        <div id="enemyList"></div>
    </div>

    <div class="controls">
        <p>⬅️ WASD - движение | 🖱️ Мышь - камера | ПРОБЕЛ - прыжок</p>
        <p>Поймай всех 3 врагов чтобы выиграть!</p>
    </div>

    <div class="game-over" id="gameOverScreen">
        <h1 id="gameOverTitle">ПОБЕДА! 🎉</h1>
        <p>Вы поймали всех врагов!</p>
        <p>Финальный счёт: <span id="finalScore">0</span></p>
        <button onclick="location.reload()">🔄 Играть заново</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@latest/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // === ИНИЦИАЛИЗАЦИЯ ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 500, 1000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // === ОСВЕЩЕНИЕ ===
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(200, 150, 100);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 4096;
        directionalLight.shadow.mapSize.height = 4096;
        directionalLight.shadow.camera.far = 1000;
        directionalLight.shadow.camera.left = -500;
        directionalLight.shadow.camera.right = 500;
        directionalLight.shadow.camera.top = 500;
        directionalLight.shadow.camera.bottom = -500;
        scene.add(directionalLight);

        // === ПАРК ДИСНЕЯ (ЗЕМЛЯ) ===
        function createPark() {
            const parkGroup = new THREE.Group();

            // Основная земля
            const groundGeometry = new THREE.PlaneGeometry(800, 800);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x90EE90 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            parkGroup.add(ground);

            // Дорожки парка
            const pathMaterial = new THREE.MeshLambertMaterial({ color: 0xD3D3D3 });
            
            // Горизонтальная дорожка
            const pathH = new THREE.Mesh(
                new THREE.PlaneGeometry(800, 50),
                pathMaterial
            );
            pathH.rotation.x = -Math.PI / 2;
            pathH.position.y = 0.01;
            parkGroup.add(pathH);

            // Вертикальная дорожка
            const pathV = new THREE.Mesh(
                new THREE.PlaneGeometry(50, 800),
                pathMaterial
            );
            pathV.rotation.x = -Math.PI / 2;
            pathV.position.y = 0.01;
            parkGroup.add(pathV);

            // Трава вокруг
            for (let x = -300; x <= 300; x += 60) {
                for (let z = -300; z <= 300; z += 60) {
                    if (Math.abs(x) > 30 && Math.abs(z) > 30) {
                        const grass = new THREE.Mesh(
                            new THREE.ConeGeometry(3, 8, 4),
                            new THREE.MeshLambertMaterial({ color: 0x228B22 })
                        );
                        grass.position.set(x + Math.random() * 20, 4, z + Math.random() * 20);
                        grass.castShadow = true;
                        parkGroup.add(grass);
                    }
                }
            }

            scene.add(parkGroup);
        }

        // === ЗАМОК В ЦЕНТРЕ ===
        function createCentralCastle() {
            const castleGroup = new THREE.Group();

            // Основание
            const baseGeometry = new THREE.BoxGeometry(120, 60, 120);
            const stoneMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xD4A574,
                shininess: 10
            });
            const base = new THREE.Mesh(baseGeometry, stoneMaterial);
            base.position.y = 30;
            base.castShadow = true;
            base.receiveShadow = true;
            castleGroup.add(base);

            // Главная башня
            const towerGeometry = new THREE.CylinderGeometry(40, 40, 150, 32);
            const tower = new THREE.Mesh(towerGeometry, stoneMaterial);
            tower.position.set(0, 75, 0);
            tower.castShadow = true;
            tower.receiveShadow = true;
            castleGroup.add(tower);

            // Крыша
            const roofGeometry = new THREE.ConeGeometry(45, 60, 32);
            const roofMaterial = new THREE.MeshPhongMaterial({ color: 0xFF1493 });
            const roof = new THREE.Mesh(roofGeometry, roofMaterial);
            roof.position.set(0, 165, 0);
            roof.castShadow = true;
            castleGroup.add(roof);

            // Боковые башни
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 2) {
                const x = Math.cos(angle) * 60;
                const z = Math.sin(angle) * 60;

                const sideGeometry = new THREE.CylinderGeometry(25, 25, 120, 24);
                const side = new THREE.Mesh(sideGeometry, stoneMaterial);
                side.position.set(x, 60, z);
                side.castShadow = true;
                side.receiveShadow = true;
                castleGroup.add(side);

                const sideRoof = new THREE.Mesh(
                    new THREE.ConeGeometry(30, 40, 24),
                    roofMaterial
                );
                sideRoof.position.set(x, 140, z);
                sideRoof.castShadow = true;
                castleGroup.add(sideRoof);
            }

            // Флаг на вершине
            const flagPole = new THREE.Mesh(
                new THREE.CylinderGeometry(2, 2, 50, 8),
                new THREE.MeshPhongMaterial({ color: 0x8B4513 })
            );
            flagPole.position.y = 215;
            castleGroup.add(flagPole);

            const flag = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 20),
                new THREE.MeshPhongMaterial({ color: 0xFF6B9D })
            );
            flag.position.set(20, 215, 0);
            castleGroup.add(flag);

            castleGroup.position.y = 0;
            scene.add(castleGroup);
        }

        // === ДОСТОПРИМЕЧАТЕЛЬНОСТИ ПАРКА ===
        function createParkAttractions() {
            // Карусель слева
            const carouselBase = new THREE.Mesh(
                new THREE.CylinderGeometry(50, 50, 10, 32),
                new THREE.MeshPhongMaterial({ color: 0xFF1493 })
            );
            carouselBase.position.set(-200, 5, -200);
            carouselBase.castShadow = true;
            scene.add(carouselBase);

            const carouselTop = new THREE.Mesh(
                new THREE.CylinderGeometry(60, 60, 5, 32),
                new THREE.MeshPhongMaterial({ color: 0xFFD700 })
            );
            carouselTop.position.set(-200, 50, -200);
            carouselTop.castShadow = true;
            scene.add(carouselTop);

            // Колесо обозрения справа
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const x = Math.cos(angle) * 80;
                const y = Math.sin(angle) * 80;
                
                const cabin = new THREE.Mesh(
                    new THREE.BoxGeometry(15, 15, 15),
                    new THREE.MeshPhongMaterial({ color: 0x00BFFF })
                );
                cabin.position.set(200 + x, 100 + y, -200);
                cabin.castShadow = true;
                scene.add(cabin);
            }

            // Колесо в центре
            const wheelGeometry = new THREE.TorusGeometry(80, 3, 16, 32);
            const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x696969 });
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(200, 100, -200);
            wheel.receiveShadow = true;
            scene.add(wheel);

            // Фонтан в парке
            const fountainBase = new THREE.Mesh(
                new THREE.CylinderGeometry(40, 50, 8, 32),
                new THREE.MeshPhongMaterial({ color: 0xB0C4DE })
            );
            fountainBase.position.set(200, 4, 150);
            fountainBase.castShadow = true;
            scene.add(fountainBase);

            const fountainColumn = new THREE.Mesh(
                new THREE.CylinderGeometry(15, 15, 60, 24),
                new THREE.MeshPhongMaterial({ color: 0x4169E1 })
            );
            fountainColumn.position.set(200, 35, 150);
            fountainColumn.castShadow = true;
            scene.add(fountainColumn);
        }

        // === ПРОСТЫЕ 3D МОДЕЛИ ПЕРСОНАЖЕЙ ===
        function createCharacter(name, color) {
            const group = new THREE.Group();

            // Тело
            const bodyGeometry = new THREE.SphereGeometry(12, 20, 20);
            const bodyMaterial = new THREE.MeshPhongMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 12;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Голова
            const headGeometry = new THREE.SphereGeometry(10, 20, 20);
            const head = new THREE.Mesh(headGeometry, bodyMaterial);
            head.position.y = 28;
            head.castShadow = true;
            head.receiveShadow = true;
            group.add(head);

            // Глаза
            for (let i = -1; i <= 1; i += 2) {
                const eyeGeometry = new THREE.SphereGeometry(3, 12, 12);
                const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
                const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                eye.position.set(i * 4, 32, 9);
                group.add(eye);

                const pupilGeometry = new THREE.SphereGeometry(1.5, 8, 8);
                const pupilMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const pupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
                pupil.position.set(i * 4, 32, 10);
                group.add(pupil);
            }

            // Ноги
            for (let i = -1; i <= 1; i += 2) {
                const legGeometry = new THREE.CylinderGeometry(4, 4, 12, 12);
                const legMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(i * 5, 3, 0);
                leg.castShadow = true;
                leg.receiveShadow = true;
                group.add(leg);
            }

            return group;
        }

        // === ИГРОК (Микки) ===
        const playerGroup = createCharacter("Player", 0xFF0000);
        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        const player = {
            group: playerGroup,
            position: new THREE.Vector3(0, 0, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            speed: 0.8,
            health: 3,
            isJumping: false,
            jumpForce: 0.4,
            direction: new THREE.Vector3(0, 0, -1),
            rotation: 0
        };

        // === ВРАГИ ===
        const enemies = [
            {
                name: "Гумба",
                model: createCharacter("Enemy1", 0x8B4513),
                position: new THREE.Vector3(150, 0, 150),
                speed: 0.3,
                health: 1,
                caught: false,
                chaseDistance: 200
            },
            {
                name: "Крюк",
                model: createCharacter("Enemy2", 0x800000),
                position: new THREE.Vector3(-150, 0, 150),
                speed: 0.25,
                health: 1,
                caught: false,
                chaseDistance: 200
            },
            {
                name: "Малефисента",
                model: createCharacter("Enemy3", 0x4B0082),
                position: new THREE.Vector3(150, 0, -150),
                speed: 0.35,
                health: 1,
                caught: false,
                chaseDistance: 200
            }
        ];

        enemies.forEach(enemy => {
            enemy.model.position.copy(enemy.position);
            scene.add(enemy.model);
        });

        // === УПРАВЛЕНИЕ И КАМЕРА ===
        const keys = {};
        let mouseX = 0;
        let mouseY = 0;
        let cameraDistance = 50;
        let cameraHeight = 30;
        let cameraAngle = 0;

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            cameraAngle = mouseX * Math.PI;
        });

        // === ПЕРЕМЕННЫЕ ИГРЫ ===
        let score = 0;
        let caughtCount = 0;
        let gameOver = false;

        // === ОСНОВНОЙ ЦИКЛ ===
        function gameLoop() {
            requestAnimationFrame(gameLoop);

            if (!gameOver) {
                // === ДВИЖЕНИЕ ИГРОКА ===
                const moveDir = new THREE.Vector3(0, 0, 0);
                let isMoving = false;

                if (keys['w'] || keys['arrowup']) {
                    moveDir.z -= 1;
                    isMoving = true;
                }
                if (keys['s'] || keys['arrowdown']) {
                    moveDir.z += 1;
                    isMoving = true;
                }
                if (keys['a'] || keys['arrowleft']) {
                    moveDir.x -= 1;
                    isMoving = true;
                }
                if (keys['d'] || keys['arrowright']) {
                    moveDir.x += 1;
                    isMoving = true;
                }

                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    
                    // Поворот в направлении движения
                    const targetRotation = Math.atan2(moveDir.x, moveDir.z);
                    player.group.rotation.y = targetRotation;

                    player.group.position.x += moveDir.x * player.speed;
                    player.group.position.z += moveDir.z * player.speed;
                }

                // === ПРЫЖОК ===
                if ((keys[' '] || keys['spacebar']) && !player.isJumping) {
                    player.velocity.y = player.jumpForce;
                    player.isJumping = true;
                    keys[' '] = false;
                    keys['spacebar'] = false;
                }

                // === ГРАВИТАЦИЯ ===
                player.velocity.y -= 0.015;
                player.group.position.y += player.velocity.y;

                if (player.group.position.y <= 0) {
                    player.group.position.y = 0;
                    player.velocity.y = 0;
                    player.isJumping = false;
                }

                // === ГРАНИЦЫ КАРТЫ ===
                const mapSize = 350;
                player.group.position.x = Math.max(-mapSize, Math.min(mapSize, player.group.position.x));
                player.group.position.z = Math.max(-mapSize, Math.min(mapSize, player.group.position.z));

                // === AI ВРАГОВ ===
                enemies.forEach(enemy => {
                    if (!enemy.caught) {
                        const dx = player.group.position.x - enemy.model.position.x;
                        const dz = player.group.position.z - enemy.model.position.z;
                        const distance = Math.sqrt(dx * dx + dz * dz);

                        // Враг видит игрока
                        if (distance < enemy.chaseDistance) {
                            if (distance > 0.1) {
                                enemy.model.position.x += (dx / distance) * enemy.speed;
                                enemy.model.position.z += (dz / distance) * enemy.speed;
                                enemy.model.rotation.y = Math.atan2(dx, dz);
                            }
                        } else {
                            // Случайное блуждание
                            if (!enemy.wanderTime) enemy.wanderTime = Math.random() * 200 + 100;
                            enemy.wanderTime--;
                            if (enemy.wanderTime <= 0) {
                                enemy.wanderDir = (Math.random() - 0.5) * 0.1;
                                enemy.wanderTime = Math.random() * 200 + 100;
                            }
                            enemy.model.rotation.y += enemy.wanderDir;
                            enemy.model.position.x += Math.sin(enemy.model.rotation.y) * enemy.speed * 0.5;
                            enemy.model.position.z += Math.cos(enemy.model.rotation.y) * enemy.speed * 0.5;
                        }

                        // Границы врага
                        enemy.model.position.x = Math.max(-mapSize, Math.min(mapSize, enemy.model.position.x));
                        enemy.model.position.z = Math.max(-mapSize, Math.min(mapSize, enemy.model.position.z));

                        // Проверка ловли
                        const catchDistance = 20;
                        if (distance < catchDistance) {
                            enemy.caught = true;
                            scene.remove(enemy.model);
                            caughtCount++;
                            score += 100;

                            // Эффект ловли
                            const notification = document.createElement('div');
                            notification.className = 'catch-notification';
                            notification.textContent = `✨ ${enemy.name} поймана! ✨`;
                            document.body.appendChild(notification);
                            setTimeout(() => notification.remove(), 800);

                            if (caughtCount === 3) {
                                gameOver = true;
                                document.getElementById('gameOverScreen').style.display = 'block';
                                document.getElementById('finalScore').textContent = score;
                            }
                        }
                    }
                });

                // === ОБНОВЛЕНИЕ КАМЕРЫ (от 3-го лица) ===
                const cameraOffsetX = Math.sin(cameraAngle) * cameraDistance;
                const cameraOffsetZ = Math.cos(cameraAngle) * cameraDistance;

                camera.position.x = player.group.position.x + cameraOffsetX;
                camera.position.y = player.group.position.y + cameraHeight;
                camera.position.z = player.group.position.z + cameraOffsetZ;
                camera.lookAt(player.group.position.x, player.group.position.y + 15, player.group.position.z);

                // === ОБНОВЛЕНИЕ UI ===
                document.getElementById('score').textContent = score;
                document.getElementById('caught').textContent = caughtCount;
                document.getElementById('health').textContent = '❤️'.repeat(Math.max(0, player.health));

                let statusText = '🎯 Ищите врагов в парке!';
                if (caughtCount === 1) statusText = '🎯 Осталось 2 врага!';
                if (caughtCount === 2) statusText = '🎯 Остался 1 враг!';
                if (caughtCount === 3) statusText = '✨ ВСЕ ВРАГИ ПОЙМАНЫ! ✨';
                document.getElementById('gameStatus').textContent = statusText;

                // Обновление списка врагов
                const enemyList = document.getElementById('enemyList');
                enemyList.innerHTML = '';
                enemies.forEach(enemy => {
                    const item = document.createElement('div');
                    item.className = 'enemy-item' + (enemy.caught ? ' caught' : '');
                    item.textContent = enemy.caught ? `✅ ${enemy.name}` : `⚠️ ${enemy.name}`;
                    enemyList.appendChild(item);
                });
            }

            renderer.render(scene, camera);
        }

        // === ИНИЦИАЛИЗАЦИЯ СЦЕНЫ ===
        createPark();
        createCentralCastle();
        createParkAttractions();

        // Скрыть экран загрузки
        setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';
        }, 500);

        gameLoop();

        // === АДАПТИВНОСТЬ ===
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
